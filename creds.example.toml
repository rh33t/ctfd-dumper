# Copy this to creds.toml and fill in your details, then run:
#   python main.py --creds creds.toml
# creds.toml is git-ignored so your login stays private.

[ctfd]
url = "https://myctf.ctfd.io"

# Log in one of two ways.

# 1) API token (CTFd menu > Settings > Access Tokens > Generate):
token = "ctfd_your_token_here"

# 2) Or email + password instead of a token. Delete the token line above,
#    then uncomment these. Special characters like % @ # need no escaping.
# email = "me@example.com"
# password = "my%pass@word"

# Optional. Left out, name defaults to the site host and output to a folder
# named after it in your current directory.
# name = "MyCTF"
# output = "~/ctfs/myctf"
